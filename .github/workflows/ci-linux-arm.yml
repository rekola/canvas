name: Linux ARM

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  # Cairo backend on aarch64, to catch endianness/char-signedness/SIMD assumptions.
  build-and-test:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libcairo2-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build and test with texture packing
        run: |
          cmake -B build-packing -DCMAKE_BUILD_TYPE=Release -DCANVAS_TEXTURE_PACKING=ON
          cmake --build build-packing -j
          ctest --test-dir build-packing --output-on-failure
