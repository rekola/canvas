name: macOS

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  # Builds the Quartz 2D backend and runs the pixel tests on it.
  build-and-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCANVAS_BACKEND_CAIRO=OFF -DCANVAS_BACKEND_QUARTZ=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure
